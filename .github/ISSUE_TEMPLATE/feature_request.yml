name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Imagiflume stays free, offline, and local. Check the roadmap and known
        issues in the README before suggesting something that is already planned.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I checked the roadmap and known issues in the README.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generation quality
        - Editing and reference images
        - Prompt improvement
        - Performance and VRAM
        - Interface and usability
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works offline and does not require an account, cloud service, or payment.
          required: true
