name: Build app release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for v0.2.0-beta.<run>)"
        required: false
        default: ""
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
      - "v*-test*"

permissions:
  contents: write

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 ships GTK 4.14 / libadwaita 1.5, which is too old for the
    # app (GTK 4.16+, libadwaita 1.6+). Debian 13 trixie provides GTK 4.18,
    # libadwaita 1.7 and glibc 2.41.
    container:
      image: debian:trixie
    defaults:
      run:
        # Container jobs default to `sh`; the steps rely on bash.
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config file \
            patchelf librsvg2-bin librsvg2-dev libglib2.0-bin libgtk-4-bin \
            gobject-introspection xvfb xauth dbus libgl1 libegl1 \
            libgtk-4-dev libadwaita-1-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libssl-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          set -eux
          cargo build --release --locked

      - name: Report library requirements
        run: |
          set -eux
          echo "--- max GLIBC requirement ---"
          objdump -T target/release/imagiflume \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5
          echo "--- missing shared libraries ---"
          ldd target/release/imagiflume | grep "not found" || echo "none"

      - name: Resolve release tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.2.0-beta.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Building release $tag"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/imagiflume dist/
          cp README.md CHANGELOG.md LICENSE dist/
          cp packaging/io.github.tibssy.Imagiflume.desktop dist/
          cp packaging/io.github.tibssy.Imagiflume.svg dist/
          # Checksum of the binary, shipped inside the archive.
          (cd dist && sha256sum imagiflume > imagiflume.sha256)
          tar -C dist -czf imagiflume-linux-x86_64.tar.gz .
          # Checksum of the archive itself, published as a release asset.
          sha256sum imagiflume-linux-x86_64.tar.gz \
            > imagiflume-linux-x86_64.tar.gz.sha256
          ls -lh imagiflume-linux-x86_64.tar.gz ./*.sha256
          cat imagiflume-linux-x86_64.tar.gz.sha256

      - name: Build AppImage
        env:
          APPIMAGE_TOOLS: ${{ runner.temp }}/appimage-tools
        run: |
          set -eux
          ./packaging/appimage/build-appimage.sh \
            --binary target/release/imagiflume \
            --outdir dist
          ls -lh dist/imagiflume-linux-x86_64.AppImage*

      - name: Smoke-test AppImage
        run: ./packaging/appimage/smoke-test.sh dist/imagiflume-linux-x86_64.AppImage

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Imagiflume ${{ env.RELEASE_TAG }} (beta)"
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            **Beta test build** of Imagiflume. Expect rough edges.

            - The Flatpak bundle is the recommended install channel. It is
              attached below with its own `.sha256` file.
            - `imagiflume-linux-x86_64.AppImage` bundles GTK 4 and libadwaita.
              It still needs glibc 2.41+ (Debian 13+, Fedora 41+, Ubuntu
              25.04+), and camera capture uses the host GStreamer plugins.
            - Built on Debian 13 (trixie) with GTK 4.18 and libadwaita 1.7.
            - The app binary is dynamically linked: it needs a host with
              GTK 4.16+, libadwaita 1.6+, GStreamer 1.20+ and glibc 2.39+
              (Debian 13, Ubuntu 24.04 or newer). Camera capture also needs
              the PipeWire GStreamer plugin.
            - `imagiflume-linux-x86_64.tar.gz` contains the binary, README,
              LICENSE, desktop entry and icon.
            - Verify the download with
              `sha256sum -c imagiflume-linux-x86_64.tar.gz.sha256`, or the
              extracted binary with `sha256sum -c imagiflume.sha256`.
          files: |
            imagiflume-linux-x86_64.tar.gz
            imagiflume-linux-x86_64.tar.gz.sha256
            dist/imagiflume-linux-x86_64.AppImage
            dist/imagiflume-linux-x86_64.AppImage.sha256
